<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - MojeWesele</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #cba052; --dark: #2c3e50; --light: #fdfbf7; }
        body { font-family: 'Montserrat', sans-serif; background: var(--light); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .admin-card { background: white; padding: 50px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); width: 100%; max-width: 500px; text-align: center; }
        h1 { font-family: 'Playfair Display', serif; color: var(--dark); margin-bottom: 30px; }
        label { display: block; text-align: left; font-weight: 600; margin-bottom: 10px; font-size: 0.9rem; }
        input { width: 100%; padding: 15px; margin-bottom: 25px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .btn-gen { background: var(--primary); color: white; border: none; padding: 15px 30px; border-radius: 30px; cursor: pointer; font-weight: 700; width: 100%; font-size: 1rem; }
        .result-box { margin-top: 30px; padding: 20px; background: #f0f9f5; border: 1px dashed #1abc9c; border-radius: 10px; display: none; }
        .result-box a { color: #16a085; font-weight: bold; word-break: break-all; text-decoration: none; }
    </style>
</head>
<body>
    <div class="admin-card">
        <h1>Generator Stron</h1>
        <label>Imiona Pary Młodej</label>
        <input type="text" id="names" placeholder="np. Kasia i Tomek">
        <button class="btn-gen" onclick="generate()">Generuj i kopiuj link</button>

        <div id="result" class="result-box">
            <p style="margin-bottom: 10px; font-size: 0.8rem;">Link gotowy do wysłania:</p>
            <a id="link" href="#" target="_blank"></a>
        </div>
    </div>

    <script>
        function generate() {
            const nameVal = document.getElementById('names').value;
            if(!nameVal) return alert("Wpisz imiona!");
            const id = Math.random().toString(36).substr(2, 5).toUpperCase();
            const baseUrl = window.location.href.split('admin.html')[0];
            const finalUrl = `${baseUrl}panel.html?names=${encodeURIComponent(nameVal)}&id=${id}`;
            
            document.getElementById('link').href = finalUrl;
            document.getElementById('link').innerText = finalUrl;
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
